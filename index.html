<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typing Trainer</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>Typing Trainer</h1>


<div id="text">
PRESS START
</div>


<div class="line"></div>



<div id="keyboard">


<div class="row">
<span>Q</span>
<span>W</span>
<span>E</span>
<span>R</span>
<span>T</span>
<span>Y</span>
<span>U</span>
<span>I</span>
<span>O</span>
<span>P</span>
</div>


<div class="row">

<span>A</span>
<span>S</span>
<span>D</span>
<span>F</span>

<span class="gap"></span>

<span>J</span>
<span>K</span>
<span>L</span>
<span>;</span>

</div>


<div class="row">

<span>Z</span>
<span>X</span>
<span>C</span>
<span>V</span>
<span>B</span>
<span>N</span>
<span>M</span>

</div>


</div>




<div id="finger">
等待开始
</div>




<div class="stats">


<p>
时间：
<span id="time">60</span>
</p>


<p>
速度：
<span id="speed">0</span>
WPM
</p>


<p>
正确率：
<span id="accuracy">100</span>%
</p>


<p>
错误：
<span id="errors">0</span>
</p>


</div>



<button id="start">
START
</button>




<audio id="bgm" loop>

<source src="music/dienian.mp3" type="audio/mpeg">

</audio>



</div>



<script src="script.js"></script>


</body>


</html>
